<style>
  :root{
    --bg:#06130c; --green:#1e9b47; --green-soft:#2fbf63; --yellow:#f7c70c; --yellow-soft:#ffd84a;
    --cream:#f4f1e6; --glass:rgba(255,255,255,.05); --glass-line:rgba(255,255,255,.11);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--cream);min-height:100vh;overflow-x:hidden;line-height:1.5}
  body::before{content:'';position:fixed;inset:0;z-index:-2;
    background:radial-gradient(ellipse at 18% 8%,rgba(30,155,71,.28) 0%,transparent 55%),
               radial-gradient(ellipse at 85% 92%,rgba(247,199,12,.07) 0%,transparent 50%),var(--bg)}
  body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--yellow);outline-offset:3px;border-radius:6px}

  /* progress + spotlight */
  .scroll-progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:9999;transform-origin:left;transform:scaleX(0);
    background:linear-gradient(90deg,var(--green),var(--yellow),var(--green));background-size:200%;animation:gm 3s linear infinite}
  @keyframes gm{to{background-position:200%}}
  .cursor-spot{position:fixed;pointer-events:none;z-index:0;width:320px;height:320px;border-radius:50%;opacity:0;transition:opacity .3s;
    background:radial-gradient(circle,rgba(247,199,12,.07) 0%,transparent 70%);transform:translate(-50%,-50%)}
  @media(hover:hover){.cursor-spot{opacity:1}}

  /* navbar */
  .navbar{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:14px 5%;background:rgba(6,19,12,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--glass-line)}
  .nav-logo{font-family:'Onest',sans-serif;font-weight:700;font-size:1.35rem;text-decoration:none;color:var(--green-soft);display:flex;align-items:center;gap:10px}
  .nav-logo span{color:var(--yellow)}
  .nav-logo svg{width:28px;height:28px;flex:none}
  .nav-links{display:flex;gap:22px;list-style:none;align-items:center}
  .nav-links a{color:rgba(255,255,255,.72);text-decoration:none;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;transition:color .2s}
  .nav-links a:hover{color:var(--yellow)}
  .nav-right{display:flex;align-items:center;gap:10px}
  .lang{display:flex;border:1px solid var(--glass-line);border-radius:999px;overflow:hidden}
  .lang button{background:none;border:0;color:rgba(255,255,255,.65);font:600 .72rem 'Inter',sans-serif;letter-spacing:.06em;padding:6px 11px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--yellow);color:#10210f}
  .btn{display:inline-block;text-decoration:none;font:700 .85rem 'Inter',sans-serif;padding:11px 20px;border-radius:999px;border:1px solid transparent;cursor:pointer;transition:transform .2s,background .2s}
  .btn-primary{background:var(--yellow);color:#10210f}
  .btn-primary:hover{background:var(--yellow-soft);transform:translateY(-2px)}
  .btn-ghost{border-color:rgba(255,255,255,.28);color:#fff;background:transparent}
  .btn-ghost:hover{border-color:var(--yellow);color:var(--yellow)}
  .nav-cta{padding:8px 16px;font-size:.75rem}
  @media(max-width:860px){.nav-links{display:none}}
  @media(max-width:420px){.nav-cta{display:none}}

  /* layout */
  .wrapper{position:relative;z-index:1;width:100%;max-width:1200px;margin:0 auto;padding:130px 5% 50px;display:flex;flex-direction:column;align-items:center}
  section{width:100%;scroll-margin-top:90px}

  /* hero */
  .hero{text-align:center;margin-bottom:3rem;animation:fadeUp 1s ease-out}
  .hero-logo{width:min(260px,62vw);height:auto;display:block;margin:0 auto 6px}
  .badge{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow);
    border:1px solid var(--yellow);padding:5px 14px;border-radius:999px;margin-bottom:1.8rem}
  .tagline{font-family:'Onest',sans-serif;font-weight:700;font-size:clamp(1.6rem,4.2vw,2.8rem);line-height:1.2;max-width:820px;margin:0 auto 1rem;color:#fff}
  .tagline em{font-style:normal;color:var(--yellow-soft)}
  .sub-tag{font-size:1rem;color:rgba(255,255,255,.62);max-width:660px;margin:0 auto 1.8rem;line-height:1.65}
  .hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

  /* stats */
  .stats-bar{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;padding:24px 28px;margin-bottom:.6rem;width:100%;
    background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--glass-line);border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .stat{text-align:center;flex:1;min-width:130px}
  .stat-num{font-family:'Onest',sans-serif;font-size:1.7rem;font-weight:700;color:var(--yellow-soft);display:block;animation:statIn .6s cubic-bezier(.34,1.56,.64,1) both}
  .stat:nth-child(2) .stat-num{animation-delay:.1s}.stat:nth-child(3) .stat-num{animation-delay:.2s}.stat:nth-child(4) .stat-num{animation-delay:.3s}.stat:nth-child(5) .stat-num{animation-delay:.4s}
  .stat-label{font-size:.66rem;color:rgba(255,255,255,.5);margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
  .stat-num{white-space:nowrap}
  @media(max-width:520px){.stat{min-width:130px}.stat-num{font-size:1.35rem}}
  .source{font-size:.7rem;color:rgba(255,255,255,.38);text-align:center;margin-bottom:4.5rem}

  /* titles */
  .section-title{font-family:'Onest',sans-serif;font-size:clamp(1.5rem,3vw,2rem);font-weight:700;color:#fff;text-align:center;margin-bottom:.5rem}
  .section-sub{font-size:.78rem;color:rgba(255,255,255,.45);text-align:center;margin:0 auto 2.4rem;text-transform:uppercase;letter-spacing:.12em;max-width:640px}

  /* journey cards */
  .sitemap{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;width:100%;margin-bottom:5rem}
  @media(max-width:760px){.sitemap{grid-template-columns:1fr 1fr}}
  @media(max-width:480px){.sitemap{grid-template-columns:1fr}}
  .card{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:26px 22px;border-radius:18px;
    background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--glass-line);
    transition:all .3s cubic-bezier(.34,1.56,.64,1);animation:cardIn .6s cubic-bezier(.34,1.2,.64,1) both}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c,var(--yellow));opacity:0;transition:opacity .3s}
  .card:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);transform:translateY(-8px);box-shadow:0 20px 50px rgba(0,0,0,.4)}
  .card:hover::before{opacity:1}
  .card-icon{font-size:1.9rem}
  .card-label{font-size:.66rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--c,var(--yellow))}
  .card-title{font-family:'Onest',sans-serif;font-size:1.12rem;font-weight:600;color:#fff;line-height:1.3}
  .card-desc{font-size:.82rem;color:rgba(255,255,255,.58);line-height:1.6;flex:1}
  .card.featured{grid-column:span 2;flex-direction:row;align-items:center;gap:24px;padding:30px 28px;
    background:linear-gradient(135deg,rgba(247,199,12,.11) 0%,rgba(255,255,255,.04) 100%)}
  .featured-icon{font-size:3.2rem;flex:none}
  .featured-title{font-family:'Onest',sans-serif;font-size:1.35rem;font-weight:700;color:#fff;margin-bottom:8px;line-height:1.25}
  .featured-badge{display:inline-block;background:rgba(247,199,12,.14);border:1px solid rgba(247,199,12,.4);color:var(--yellow-soft);
    font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:999px;margin-bottom:10px}
  .card.wide{grid-column:1/-1}
  @media(max-width:760px){.card.featured{grid-column:span 2;flex-direction:column;align-items:flex-start}}
  @media(max-width:480px){.card.featured{grid-column:span 1}}

  /* trust */
  .trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:100%;margin-bottom:5rem}
  @media(max-width:960px){.trust-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.trust-grid{grid-template-columns:1fr}}
  .trust{padding:22px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--glass-line);transition:transform .3s,border-color .3s}
  .trust:hover{transform:translateY(-5px);border-color:rgba(47,191,99,.5)}
  .trust .ic{font-size:1.5rem;display:block;margin-bottom:10px}
  .trust h3{font-family:'Onest',sans-serif;font-size:1rem;color:#fff;margin-bottom:6px}
  .trust p{font-size:.78rem;color:rgba(255,255,255,.55);line-height:1.55}

  /* verticals */
  .market-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;width:100%;margin-bottom:5rem}
  @media(max-width:900px){.market-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:500px){.market-grid{grid-template-columns:1fr}}
  .market-card{padding:24px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--glass-line);
    transition:transform .3s,border-color .3s;animation:cardIn .6s cubic-bezier(.34,1.2,.64,1) both}
  .market-card:hover{transform:translateY(-5px);border-color:rgba(247,199,12,.35)}
  .m-icon{font-size:1.7rem;display:block;margin-bottom:12px}
  .m-title{font-family:'Onest',sans-serif;font-size:1.05rem;color:#fff;margin-bottom:8px;line-height:1.3}
  .m-desc{font-size:.78rem;color:rgba(255,255,255,.55);line-height:1.55;margin-bottom:16px}
  .m-stat{border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
  .chip{display:inline-block;font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 11px;border-radius:999px}
  .chip.pilot{background:rgba(47,191,99,.15);color:var(--green-soft);border:1px solid rgba(47,191,99,.45)}
  .chip.next{background:rgba(247,199,12,.12);color:var(--yellow-soft);border:1px solid rgba(247,199,12,.4)}
  .chip.later{background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.2)}

  /* open + pilot */
  .panel{width:100%;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-bottom:5rem}
  @media(max-width:860px){.panel{grid-template-columns:1fr}}
  .box{padding:28px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-line)}
  .box h3{font-family:'Onest',sans-serif;font-size:1.25rem;color:#fff;margin-bottom:12px}
  .box ul{list-style:none;display:grid;gap:10px}
  .box li{font-size:.88rem;color:rgba(255,255,255,.72);padding-left:24px;position:relative;line-height:1.55}
  .box li::before{content:'✓';position:absolute;left:0;color:var(--green-soft);font-weight:700}
  .gates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 14px}
  .gate{text-align:center;padding:14px 6px;border-radius:14px;background:rgba(255,255,255,.04)}
  .gate b{display:block;font-family:'Onest',sans-serif;font-size:1.6rem;color:var(--yellow-soft)}
  .gate span{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.55)}
  .note{font-size:.74rem;color:rgba(255,255,255,.45)}

  /* join */
  .join{max-width:720px;margin:0 auto 4.5rem;padding:30px;border-radius:22px;background:var(--glass);border:1px solid var(--glass-line)}
  form{display:grid;gap:14px;margin-top:6px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.row{grid-template-columns:1fr}}
  label{display:grid;gap:6px;font-size:.74rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.6)}
  input,select,textarea{width:100%;font:400 .95rem 'Inter',sans-serif;color:#fff;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:12px 14px}
  select option{color:#10210f}
  textarea{min-height:96px;resize:vertical}
  input::placeholder,textarea::placeholder{color:rgba(255,255,255,.35)}
  .form-msg{font-size:.82rem;color:var(--green-soft);min-height:1.2em}

  /* footer */
  .index-footer{width:100%;text-align:center;font-size:.76rem;color:rgba(255,255,255,.4);line-height:1.9;padding:2rem 0;border-top:1px solid var(--glass-line)}
  .index-footer strong{color:rgba(255,255,255,.65)}

  /* consent */
  .consent{position:fixed;left:16px;right:16px;bottom:16px;z-index:2000;max-width:560px;margin:0 auto;padding:16px 18px;border-radius:16px;
    background:rgba(10,28,18,.96);border:1px solid var(--glass-line);box-shadow:0 20px 50px rgba(0,0,0,.5);display:none;gap:12px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:rgba(255,255,255,.8)}
  .consent.show{display:flex}
  .consent p{flex:1;min-width:200px}
  .consent .btn{padding:8px 16px;font-size:.78rem}

  @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
  @keyframes cardIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes statIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .sitemap .card:nth-child(2){animation-delay:.1s}.sitemap .card:nth-child(3){animation-delay:.18s}.sitemap .card:nth-child(4){animation-delay:.26s}
  .sitemap .card:nth-child(5){animation-delay:.34s}.sitemap .card:nth-child(6){animation-delay:.42s}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
